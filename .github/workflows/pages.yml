# Web app per iPhone ("Condividi -> Aggiungi alla schermata Home") su GitHub Pages: a ogni tag vX.Y.Z compila la
# cartella della web app (mobile/scripts/build-web.mjs: interfaccia + motore Pyodide + service worker) e la pubblica.
# Documentazione: docs/web-app-iphone.md.
#
# Si accende con la variabile del repository PAGES_WEB_APP = "true" (Settings -> Secrets and variables -> Actions ->
# Variables); senza, il workflow risulta "saltato" e non pubblica niente. Per accenderlo (una volta sola, lo fa l'autore):
#   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions" (il repository e' pubblico: Pages e' gratuito);
#   2. variabile PAGES_WEB_APP = true;
#   3. al tag successivo (o con "Run workflow") la web app viene compilata e pubblicata.
# Indirizzo della web app: https://<proprietario>.github.io/<repository>/ (per PDFz: https://akito996.github.io/pdfz/).
# Attenzione: impostazioni, firme salvate e file del motore restano legati all'indirizzo; cambiarlo dopo vuol dire
# reinstallare l'app sui telefoni (e perdere quei dati). Conviene decidere l'indirizzo definitivo prima di distribuirla.
name: Web app (GitHub Pages)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

# una pubblicazione per volta; quella in corso non si interrompe
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compila la web app
    if: vars.PAGES_WEB_APP == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Controllo versione
        shell: bash
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/hdpdf/__init__.py)"
          echo "Versione nel codice: $version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Il tag ${GITHUB_REF_NAME} non corrisponde a __version__ = \"$version\" (backend/hdpdf/__init__.py)."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      # motore Python (Pyodide + pacchetti): prepare-engine.mjs lo scarica solo se manca
      - uses: actions/cache@v6
        with:
          path: mobile/cache
          key: web-pyodide-${{ hashFiles('mobile/scripts/prepare-engine.mjs') }}
      - name: Librerie
        run: |
          (cd frontend && npm ci --no-audit --no-fund)
          (cd mobile && npm ci --no-audit --no-fund)
      - name: Controllo TypeScript
        working-directory: frontend
        run: node node_modules/typescript/bin/tsc -b
      - name: Build della web app
        working-directory: mobile
        run: node scripts/build-web.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: mobile/www-web

  deploy:
    name: Pubblica su GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
