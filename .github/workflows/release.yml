# Build di Windows (MSI), macOS (DMG Apple Silicon arm64), Linux (AppImage x86_64) e Android (APK) a ogni tag,
# poi pubblicazione nella GitHub Release della versione: installer + versione-*.json per l'avviso "nuova versione".
# Tag accettati: 1.0.0 oppure v1.0.0 (MAJOR.MINOR.PATCH). Il numero deve essere uguale a __version__ in backend/hdpdf/__init__.py.
#   git tag v1.0.1 && git push origin v1.0.1
# Si puo' lanciare anche a mano (Actions -> Release -> Run workflow) per provare la build: in quel caso niente pubblicazione.
#
# Avviso "nuova versione": ogni build scrive nell'app l'indirizzo UPDATE_BASE_URL (packaging/imposta-url-aggiornamenti.sh),
# di norma https://github.com/<proprietario>/<repository>/releases/latest/download/ (per PDFz: akito996/pdfz).
# releases/latest/download/<file> porta al file dell'ultima release pubblicata che non e' "pre-release" (ne' bozza):
# l'app legge li' versione-<piattaforma>.json e scarica l'installer con lo stesso indirizzo + nome del file.
# Funziona solo se il repository (o almeno le sue release) e' pubblico: le release di un repository privato
# chiedono l'accesso e l'avviso non trova niente.
#
# Impostazioni del repository (Settings -> Secrets and variables -> Actions), vedi docs/build-e-test.md:
#   variabile UPDATE_BASE_URL           facoltativa: altro indirizzo degli aggiornamenti (https://..., con la "/" finale);
#                                       vuota = le GitHub Releases di questo repository (releases/latest/download/).
#                                       La pipeline pubblica solo nella GitHub Release: con un altro indirizzo
#                                       installer e versione-*.json vanno copiati li' a parte
#   secret    ANDROID_KEYSTORE_BASE64   chiave di firma Android di PDFz (pdfz-release.jks) in base64
#   secret    ANDROID_KEYSTORE_PASSWORD password del keystore (e della chiave)
#   secret    ANDROID_KEY_ALIAS         alias della chiave (pdfz)
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # cartella pubblica con installer e versione-*.json, scritta nell'app (UPDATE_BASE_URL in backend/hdpdf/aggiornamenti.py):
  # variabile UPDATE_BASE_URL del repository se c'e', altrimenti le GitHub Releases di questo repository
  UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL || format('https://github.com/{0}/releases/latest/download/', github.repository) }}

jobs:
  version:
    name: Controllo versione
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/hdpdf/__init__.py)"
          echo "Versione nel codice: $version"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::__version__ = \"$version\" non e' nel formato MAJOR.MINOR.PATCH (es. 1.0.0)."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Il tag ${GITHUB_REF_NAME} non corrisponde a __version__ = \"$version\" (backend/hdpdf/__init__.py)."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (MSI)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # sempre: UPDATE_BASE_URL (env del workflow) entra nell'app compilata
      - name: Indirizzo degli aggiornamenti
        shell: bash
        run: bash packaging/imposta-url-aggiornamenti.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      # lingue OCR (Tesseract): lo script le scarica solo se mancano
      - uses: actions/cache@v6
        with:
          path: |
            vendor/tessdata
          key: vendor-windows-${{ hashFiles('packaging/build-windows.ps1') }}
          restore-keys: vendor-windows-
      - name: Build
        shell: pwsh
        run: ./packaging/build-windows.ps1 -OutDir dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.msi
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS (arm64)
    needs: version
    # solo Mac Apple Silicon: la versione per Mac Intel non si fa piu'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # sempre: UPDATE_BASE_URL (env del workflow) entra nell'app compilata
      - name: Indirizzo degli aggiornamenti
        shell: bash
        run: bash packaging/imposta-url-aggiornamenti.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Tesseract (per i test OCR)
        run: brew install tesseract
      - name: Build
        env:
          PYTHON: python3.12
        run: bash packaging/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux (AppImage)
    needs: version
    # l'AppImage gira sulle distribuzioni con glibc uguale o piu' recente: Ubuntu 24.04+, Debian 13+, Fedora 40+
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # sempre: UPDATE_BASE_URL (env del workflow) entra nell'app compilata
      - name: Indirizzo degli aggiornamenti
        shell: bash
        run: bash packaging/imposta-url-aggiornamenti.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Tesseract (per i test OCR)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-ita
      - name: Build
        run: bash packaging/build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error
          compression-level: 0

  android:
    name: Android (APK)
    needs: version
    # lo script di build Android e' per Windows (PowerShell); il runner ha gia' l'Android SDK
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # sempre: UPDATE_BASE_URL (env del workflow) entra nell'app compilata
      - name: Indirizzo degli aggiornamenti
        shell: bash
        run: bash packaging/imposta-url-aggiornamenti.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # motore Python dell'app (Pyodide + pacchetti): prepare-engine.mjs lo scarica solo se manca
      - uses: actions/cache@v6
        with:
          path: mobile/cache
          key: pyodide-${{ hashFiles('mobile/scripts/prepare-engine.mjs') }}
      - name: Chiave di firma
        id: chiave
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_B64) {
            if ($env:GITHUB_REF_TYPE -eq "tag") {
              # mai un APK di prova in una release: firmato con una chiave diversa, i telefoni non accetterebbero
              # poi gli aggiornamenti. Android si salta e gli altri sistemi vengono pubblicati lo stesso.
              Write-Warning "Manca il secret ANDROID_KEYSTORE_BASE64: Android non entra in questa release (vedi docs/build-e-test.md)."
              "salta=true" >> $env:GITHUB_OUTPUT
              exit 0
            }
            Write-Warning "Manca il secret ANDROID_KEYSTORE_BASE64: APK di prova (debug)."
            exit 0
          }
          $ks = Join-Path $env:RUNNER_TEMP "pdfz-release.jks"
          [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:KEYSTORE_B64))
          "HDPDF_KEYSTORE=$ks" >> $env:GITHUB_ENV
      - name: Build
        if: steps.chiave.outputs.salta != 'true'
        shell: pwsh
        env:
          HDPDF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HDPDF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HDPDF_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./packaging/build-android.ps1 -OutDir dist
      - uses: actions/upload-artifact@v7
        if: steps.chiave.outputs.salta != 'true'
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0

  release:
    name: Pubblica release
    needs: [version, windows, macos, linux, android]
    # si pubblica quello che si e' compilato: un sistema che non riesce (o Android senza chiave) non blocca gli altri.
    # Con "Re-run failed jobs" il sistema mancante si aggiunge alla stessa release.
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.version.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: File per l'avviso di nuova versione
        run: |
          mkdir -p assets updates
          ls -lh assets
          : > mancanti.txt
          # link DIRETTO all'installer di ogni piattaforma per QUESTA versione (Windows MSI, macOS DMG, Linux AppImage,
          # Android APK): con le GitHub Releases resta valido anche quando escono versioni nuove; con un indirizzo
          # proprio (variabile UPDATE_BASE_URL) e' quell'indirizzo + nome del file
          link="${{ vars.UPDATE_BASE_URL }}"
          [ -n "$link" ] || link="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"
          pagina="https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          for p in "windows:PDFz-$VERSION-x64.msi" "macos:PDFz-$VERSION-macOS-arm64.dmg" \
                   "linux:PDFz-$VERSION-x86_64.AppImage" "android:PDFz-$VERSION-android.apk"; do
            file="${p#*:}"
            if [ ! -f "assets/$file" ]; then
              echo "::warning::Manca assets/$file: ${p%%:*} non entra in questa release"
              echo "${p%%:*}" >> mancanti.txt
              continue
            fi
            python3 packaging/scrivi_versione.py "${p%%:*}" "$file" updates --installer "assets/$file" --link-base "$link" --pagina "$pagina"
          done
          ls updates/versione-*.json >/dev/null 2>&1 || { echo "::error::Nessun installer compilato: niente da pubblicare."; exit 1; }
      - name: Note di rilascio (da CHANGELOG.md)
        run: |
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "PDFz $VERSION" > notes.md
          if [ -s mancanti.txt ]; then
            printf '\n> Non ancora disponibile in questa release: %s.\n' "$(paste -sd, mancanti.txt | sed 's/,/, /g')" >> notes.md
          fi
      - name: GitHub Release (installer e versione-*.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh updates
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # release gia' presente (es. "Re-run failed jobs"): prima gli installer, poi i versione-*.json,
            # cosi' l'avviso non punta mai a un file che non c'e' ancora
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
            gh release upload "$GITHUB_REF_NAME" updates/versione-*.json --clobber
            # le note seguono i sistemi presenti (es. dopo il Re-run che aggiunge Android sparisce "Non ancora disponibile")
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            # gh crea la release come bozza, carica tutti i file e solo alla fine la pubblica:
            # releases/latest/download/ passa alla nuova versione solo quando ci sono tutti i file
            gh release create "$GITHUB_REF_NAME" assets/* updates/versione-*.json \
              --title "PDFz $VERSION" --notes-file notes.md --verify-tag
          fi
          gh release view "$GITHUB_REF_NAME"
          echo "Avviso aggiornamenti delle app compilate: $UPDATE_BASE_URL"
