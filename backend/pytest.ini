# Test automatici (lanciati anche da packaging\build-windows.ps1).
# Si nascondono solo gli avvisi "deprecato" delle librerie esterne (starlette, pyhanko, oscrypto):
# non riguardano il codice di PDFz e non cambiano il risultato dei test.
[pytest]
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient. is deprecated
    ignore:Relying on the operating system's trust list is deprecated:DeprecationWarning
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
